name: Windows build, installer and portable package
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile, test core and publish portable x64
        shell: pwsh
        run: ./Build.ps1
      - name: Get verified portable Inno Setup compiler
        shell: pwsh
        run: ./tools/Get-InnoSetup.ps1
      - name: Build installer, safe preview and isolated fixture
        shell: pwsh
        run: ./tools/Build-Installer.ps1 -Payload ./artifacts/DesktopBubbles-win-x64 -FixtureRoot "$PWD/artifacts/installer-fixture-ä"
      - name: Test installer, update, backup and uninstall without touching user data
        shell: pwsh
        run: ./tools/Test-Installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopBubbles-win-x64
          retention-days: 7
          path: |
            artifacts/DesktopBubbles-win-x64.zip
            artifacts/DesktopBubbles-win-x64.zip.sha256
            artifacts/core-tests.txt
            artifacts/installer/DesktopBubbles-Setup-*.exe
            artifacts/installer/DesktopBubbles-Setup-*.exe.sha256
            artifacts/installer-fixture-ä/results.json
          if-no-files-found: error
